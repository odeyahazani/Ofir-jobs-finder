name: Job collector

# Scheduled scans remain off until ENABLE_SCHEDULED_SCANS=true is set in repository variables.
on:
  schedule:
    # Both Israeli UTC offsets; the worker runs only in the 08:00 and 17:00 local hours.
    - cron: '17 5,6,14,15 * * *'
  workflow_dispatch:
    inputs:
      command:
        description: Operation
        type: choice
        options: [scan, scan-and-expand, check, digest-preview, digest-send]
        default: scan

permissions:
  contents: read

# Share this group with future scheduled runs so snapshots cannot race each other.
concurrency:
  group: ofir-cloud-collector
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULED_SCANS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      APP_URL: ${{ vars.APP_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run selected operation
        env:
          OPERATION: ${{ github.event_name == 'schedule' && 'scheduled-scan' || inputs.command }}
        run: |
          case "$OPERATION" in
            scan) python -m collector.cloud scan ;;
            scan-and-expand) python -m collector.cloud scan --expand-by 1 ;;
            scheduled-scan) python -m collector.cloud scheduled-scan ;;
            check) python -m collector.cloud check ;;
            digest-preview) python -m collector.cloud digest ;;
            digest-send) python -m collector.cloud digest --send ;;
            *) exit 2 ;;
          esac
